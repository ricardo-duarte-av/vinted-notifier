matrix:
  homeserver: "https://matrix.org"
  user_id: "@vintedbot:matrix.org"
  access_token: "syt_..."      # token auth (obtain via your client or /login)
  room_id: "!abc:matrix.org"   # room to post notifications / accept commands
vinted:
  domain: "www.vinted.pt"      # which Vinted site to search: www.vinted.fr, www.vinted.es, www.vinted.co.uk, ...
  # countries: [PT, ES]        # only notify about sellers in these countries; omit = the domain's country, [ALL] = any
poll:
  interval_seconds: 300        # global default poll cadence (minimum 30)
  max_pages: 2                 # pages fetched per search per poll (96 newest items/page)
  jitter_percent: 10           # spread each tick by ±this much (0-50, 0 disables)
db_path: "./vinted.db"
